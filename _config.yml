title: HumanTone
tagline: Keep your voice in AI-assisted writing
description: Open-source prompts, practical guidelines, and real examples for writing with AI without losing your natural voice.
url: https://kamrullab.github.io
baseurl: /HumanTone
repository: kamrullab/HumanTone
author:
  name: Kamrul Hossain
  url: https://github.com/kamrullab

lang: en
timezone: Asia/Dhaka
logo: /assets/images/logo.svg
twitter:
  card: summary_large_image
social:
  name: HumanTone
  links:
    - https://github.com/kamrullab/HumanTone

theme: jekyll-theme-minimal
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image:
        path: /assets/images/og-image.png
        width: 1200
        height: 630
        alt: HumanTone | Keep your voice and lose the generic AI tone

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
